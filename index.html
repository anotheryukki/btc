<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>$BTC — Big Titty Cult</title>
<meta name="description" content="$BTC. Enter of your own free will.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#050302;
    --bone:#ede4d6;
    --bone-60:rgba(237,228,214,0.6);
    --bone-40:rgba(237,228,214,0.4);
    --crimson:#c8283a;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    overscroll-behavior:none;
  }

  body{
    font-family:'JetBrains Mono',monospace;
    color:var(--bone);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .font-black{
    font-family:'Pirata One',serif;
  }

  .stage{
    position:relative;
    height:100dvh;
    width:100vw;
    overflow:hidden;
  }

  .video-bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 58%;
    z-index:0;
  }

  @media (min-width:640px){
    .video-bg{
      object-position:92% 22%;
      transform:scale(1.28);
      transform-origin:92% 22%;
    }
  }

  .scrim{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(to bottom,
        rgba(4,2,2,0.72) 0%,
        rgba(4,2,2,0.2) 14%,
        rgba(4,2,2,0.0) 26%,
        rgba(4,2,2,0.0) 62%,
        rgba(4,2,2,0.45) 82%,
        rgba(4,2,2,0.9) 100%),
      radial-gradient(ellipse 80% 70% at 45% 45%,
        rgba(0,0,0,0) 42%,
        rgba(4,2,2,0.6) 100%);
  }

  .grade{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(ellipse 90% 80% at 50% 40%, rgba(120,18,30,0.1), rgba(18,4,6,0.32) 100%);
    mix-blend-mode:multiply;
  }

  .grain{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.04;
    mix-blend-mode:overlay;
  }

  .content{
    position:relative;
    z-index:5;
    height:100%;
    width:100%;
  }

  .mono-label{
    font-size:11px;
    font-weight:500;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--bone-60);
    text-shadow:0 1px 2px rgba(0,0,0,0.7);
  }

  .topbar{
    position:absolute;
    top:clamp(18px,3.4vh,34px);
    left:clamp(20px,4.6vw,70px);
    right:clamp(20px,4.6vw,70px);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .x-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--bone);
    text-decoration:none;
    padding:6px 2px;
    transition:transform 320ms cubic-bezier(0.22,1,0.36,1), opacity 320ms ease;
  }
  .x-link .arrow{
    display:inline-block;
    transition:transform 320ms cubic-bezier(0.22,1,0.36,1);
  }
  .x-link:hover{opacity:1; transform:translateY(-1px);}
  .x-link:hover .arrow{transform:translate(2px,-2px);}
  .x-link:active{transform:translateY(0) scale(0.98);}
  .x-link:focus-visible{outline:2px solid var(--crimson); outline-offset:4px;}

  .hero{
    position:absolute;
    right:clamp(120px,15vw,230px);
    top:50%;
    transform:translateY(-52%);
    text-align:right;
    max-width:56vw;
  }

  .wordmark{
    position:relative;
    font-size:min(34vh, 23vw);
    line-height:0.9;
    letter-spacing:-0.005em;
    color:var(--bone);
    text-shadow:0 2px 6px rgba(0,0,0,0.65), 0 24px 70px rgba(0,0,0,0.65);
    margin:0;
  }
  .wordmark::before{
    content:"";
    position:absolute;
    right:-8%;
    top:50%;
    width:78%;
    height:78%;
    transform:translateY(-50%);
    background:radial-gradient(closest-side, rgba(200,40,58,0.22), rgba(200,40,58,0) 72%);
    z-index:-1;
    pointer-events:none;
  }
  .wordmark .sym{
    color:var(--crimson);
  }

  .tagline{
    margin-top:clamp(18px,3vh,30px);
    font-size:clamp(15px,1.5vw,19px);
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--bone-60);
    text-shadow:0 1px 2px rgba(0,0,0,0.7);
  }

  .ca{
    margin-top:clamp(34px,6vh,58px);
    display:inline-flex;
    flex-direction:column;
    align-items:flex-end;
    gap:10px;
  }
  .ca-value{
    font-size:clamp(22px,3.4vh,32px);
    font-weight:600;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--bone);
    text-shadow:0 1px 2px rgba(0,0,0,0.7);
    line-height:1;
  }
  .ca-value .cursor{
    display:inline-block;
    width:0.5em;
    height:1em;
    vertical-align:-0.1em;
    margin-left:0.18em;
    background:var(--crimson);
    animation:blink 1.1s steps(1) infinite;
  }
  .ca-line{
    width:160px;
    height:1px;
    background:linear-gradient(to left, var(--bone-40), transparent);
  }

  @keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:0;}
  }

  .foot{
    position:absolute;
    right:clamp(20px,5.2vw,80px);
    bottom:clamp(18px,3.4vh,34px);
    max-width:46ch;
    text-align:right;
    font-size:10px;
    line-height:1.75;
    letter-spacing:0.02em;
    color:var(--bone-40);
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
  }

  .ca-mobile{ display:none; }

  .reveal{
    opacity:0;
    animation:reveal 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes reveal{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .hero.reveal{
    animation-name:reveal-hero;
  }
  @keyframes reveal-hero{
    from{opacity:0; transform:translateY(calc(-52% + 14px));}
    to{opacity:1; transform:translateY(-52%);}
  }
  .foot.reveal{
    animation-name:reveal-foot;
  }
  @keyframes reveal-foot{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (max-width:639px){
    .hero{
      right:auto;
      left:50%;
      top:clamp(52px,7.5vh,72px);
      transform:translateX(-50%);
      text-align:center;
      max-width:92vw;
      width:max-content;
    }
    .hero.reveal{animation-name:reveal-hero-m;}
    @keyframes reveal-hero-m{
      from{opacity:0; transform:translate(-50%,10px);}
      to{opacity:1; transform:translate(-50%,0);}
    }
    .wordmark{font-size:min(12vh, 26vw);}
    .tagline{margin-top:8px; font-size:10px;}
    .hero .ca{display:none;}
    .ca-line{background:linear-gradient(to right, transparent, var(--bone-40), transparent);}
    .ca-mobile{
      display:inline-flex;
      position:fixed;
      left:50%;
      bottom:clamp(118px,15.5vh,150px);
      transform:translateX(-50%);
      z-index:5;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }
    .ca-mobile.reveal{animation-name:reveal-ca-m;}
    @keyframes reveal-ca-m{
      from{opacity:0; transform:translate(-50%,10px);}
      to{opacity:1; transform:translate(-50%,0);}
    }
    .foot{
      left:50%;
      right:auto;
      transform:translateX(-50%);
      text-align:center;
      max-width:82vw;
      bottom:clamp(14px,2.6vh,22px);
      font-size:9px;
    }
    .foot.reveal{animation-name:reveal-foot-m;}
    @keyframes reveal-foot-m{
      from{opacity:0; transform:translate(-50%,10px);}
      to{opacity:1; transform:translate(-50%,0);}
    }
  }

  @media (max-height:520px){
    .tagline{display:none;}
    .ca{margin-top:14px;}
  }

  @media (prefers-reduced-motion: reduce){
    .ca-value .cursor{animation:none;}
    .reveal,.hero.reveal,.foot.reveal,.ca-mobile.reveal{animation:none; opacity:1;}
    .x-link,.x-link .arrow{transition:none;}
  }
</style>
</head>
<body>

<div class="stage">

  <video class="video-bg" id="bg" autoplay muted loop playsinline preload="auto">

</body>
</html>
