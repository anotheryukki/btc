<style>
  :root{
    --bg:#050302;
    --bone:#ede4d6;
    --bone-60:rgba(237,228,214,0.6);
    --bone-40:rgba(237,228,214,0.4);
    --crimson:#c8283a;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    overscroll-behavior:none;
  }

  body{
    font-family:'JetBrains Mono',monospace;
    color:var(--bone);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .font-black{
    font-family:'Pirata One',serif;
  }

  .stage{
    position:relative;
    height:100dvh;
    width:100vw;
    overflow:hidden;
  }

  .video-bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 58%;
    z-index:0;
  }

  @media (min-width:640px){
    .video-bg{
      object-position:92% 22%;
      transform:scale(1.28);
      transform-origin:92% 22%;
    }
  }

  .scrim{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(to bottom,
        rgba(4,2,2,0.72) 0%,
        rgba(4,2,2,0.2) 14%,
        rgba(4,2,2,0.0) 26%,
        rgba(4,2,2,0.0) 62%,
        rgba(4,2,2,0.45) 82%,
        rgba(4,2,2,0.9) 100%),
      radial-gradient(ellipse 80% 70% at 45% 45%,
        rgba(0,0,0,0) 42%,
        rgba(4,2,2,0.6) 100%);
  }

  .grade{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(ellipse 90% 80% at 50% 40%, rgba(120,18,30,0.1), rgba(18,4,6,0.32) 100%);
    mix-blend-mode:multiply;
  }

  .grain{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.04;
    mix-blend-mode:overlay;
  }

  /* the orbit — positioned by script around the figure in the video */
  .orbit-ring{
    position:fixed;
    z-index:4;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.4s ease 0.3s;
  }
  .orbit-ring.ready{opacity:1;}
  .orbit-ring svg{
    width:100%;
    height:100%;
    display:block;
    animation:orbit 160s linear infinite;
    transform-origin:50% 50%;
  }
  .ring-text{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:4.2px;
    fill:var(--bone);
    fill-opacity:0.72;
  }
  .ring-inner{
    fill:none;
    stroke:var(--bone);
    stroke-opacity:0.22;
    stroke-width:1;
  }
  .ring-tick{
    stroke:var(--bone);
    stroke-opacity:0.4;
    stroke-width:1;
  }

  @keyframes orbit{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  .content{
    position:relative;
    z-index:5;
    height:100%;
    width:100%;
  }

  .mono-label{
    font-size:11px;
    font-weight:500;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--bone-60);
    text-shadow:0 1px 2px rgba(0,0,0,0.7);
  }

  .topbar{
    position:absolute;
    top:clamp(18px,3.4vh,34px);
    left:clamp(20px,4.6vw,70px);
    right:clamp(20px,4.6vw,70px);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .x-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--bone);
    text-decoration:none;
    padding:6px 2px;
    transition:transform 320ms cubic-bezier(0.22,1,0.36,1), opacity 320ms ease;
  }
  .x-link .arrow{
    display:inline-block;
    transition:transform 320ms cubic-bezier(0.22,1,0.36,1);
  }
  .x-link:hover{opacity:1; transform:translateY(-1px);}
  .x-link:hover .arrow{transform:translate(2px,-2px);}
  .x-link:active{transform:translateY(0) scale(0.98);}
  .x-link:focus-visible{outline:2px solid var(--crimson); outline-offset:4px;}

  .hero{
    position:absolute;
    right:clamp(20px,5.2vw,80px);
    top:50%;
    transform:translateY(-52%);
    text-align:right;
    max-width:44vw;

  .wordmark{

    line-height:0.86;

  .tagline{

    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--bone-60);

  .ca{

    display:inline-flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;

  .ca-value{
    font-size:clamp(18px,2.6vh,24px);
    font-weight:600;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--bone);
    text-shadow:0 1px 2px rgba(0,0,0,0.7);
    line-height:1;
  }
  .ca-value .cursor{
    display:inline-block;
    width:0.55em;
    height:1em;
    vertical-align:-0.12em;
    margin-left:0.18em;
    background:var(--crimson);
    animation:blink 1.1s steps(1) infinite;
  }
  .ca-line{
    width:140px;
    height:1px;
    background:linear-gradient(to left, var(--bone-40), transparent);
  }

  @keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:0;}
  }

  .foot{
    position:absolute;
    right:clamp(20px,5.2vw,80px);
    bottom:clamp(18px,3.4vh,34px);
    max-width:46ch;
    text-align:right;
    font-size:10px;
    line-height:1.75;
    letter-spacing:0.02em;
    color:var(--bone-40);
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
  }

  .ca-mobile{ display:none; }

  .reveal{
    opacity:0;
    animation:reveal 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes reveal{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .hero.reveal{
    animation-name:reveal-hero;
  }
  @keyframes reveal-hero{
    from{opacity:0; transform:translateY(calc(-52% + 14px));}
    to{opacity:1; transform:translateY(-52%);}
  }
  .foot.reveal{
    animation-name:reveal-foot;
  }
  @keyframes reveal-foot{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (max-width:639px){
    .hero{
      right:auto;
      left:50%;
      top:clamp(52px,7.5vh,72px);
      transform:translateX(-50%);
      text-align:center;

      width:max-content;
    }
    .hero.reveal{animation-name:reveal-hero-m;}
    @keyframes reveal-hero-m{
      from{opacity:0; transform:translate(-50%,10px);}
      to{opacity:1; transform:translate(-50%,0);}
    }
    .wordmark{font-size:min(12vh, 26vw);}
    .tagline{margin-top:8px; font-size:10px;}
    .hero .ca{display:none;}
    .ca-line{background:linear-gradient(to right, transparent, var(--bone-40), transparent);}
    .ca-mobile{
      display:inline-flex;

      left:50%;
      bottom:clamp(64px,9.5vh,84px);
      transform:translateX(-50%);
      z-index:5;
      flex-direction:column;
      align-items:center;

    }
    .ca-mobile.reveal{animation-name:reveal-ca-m;}
    @keyframes reveal-ca-m{
      from{opacity:0; transform:translate(-50%,10px);}
      to{opacity:1; transform:translate(-50%,0);}
    }
    .foot{
      left:50%;
      right:auto;
      transform:translateX(-50%);
      text-align:center;
      max-width:82vw;
      bottom:clamp(14px,2.6vh,22px);
      font-size:9px;
    }
    .foot.reveal{animation-name:reveal-foot-m;}
    @keyframes reveal-foot-m{
      from{opacity:0; transform:translate(-50%,10px);}
      to{opacity:1; transform:translate(-50%,0);}
    }
    .orbit-ring .ring-text{font-size:11.5px; letter-spacing:3.6px;}
  }

  @media (max-height:520px){
    .tagline{display:none;}
    .ca{margin-top:14px;}
  }

  @media (prefers-reduced-motion: reduce){
    .orbit-ring svg{animation:none;}
    .ca-value .cursor{animation:none;}
    .reveal,.hero.reveal,.foot.reveal,.ca-mobile.reveal{animation:none; opacity:1;}
    .x-link,.x-link .arrow{transition:none;}
  }
</style>

<script>
  (function(){
    var video = document.getElementById('bg');
    var ring = document.getElementById('ring');
    var ticks = document.getElementById('ticks');
    var wide = window.matchMedia('(min-width:640px)');

    // where the figure sits in the source frame (1920x1080), and her orbit
    var SRC = { w:1920, h:1080, cx:897, cy:478, r:392 };

    for (var i = 0; i < 36; i++) {
      var a = (i / 36) * Math.PI * 2;
      var major = i % 3 === 0;
      var r1 = major ? 456 : 462, r2 = 468;
      var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', 500 + Math.cos(a) * r1);
      line.setAttribute('y1', 500 + Math.sin(a) * r1);
      line.setAttribute('x2', 500 + Math.cos(a) * r2);
      line.setAttribute('y2', 500 + Math.sin(a) * r2);
      line.setAttribute('class', 'ring-tick');
      ticks.appendChild(line);
    }

    function layout(){
      var W = video.offsetWidth, H = video.offsetHeight;
      if (!W || !H) return;
      var isWide = wide.matches;
      var px = isWide ? 0.92 : 0.5;
      var py = isWide ? 0.22 : 0.58;
      var k  = isWide ? 1.28 : 1;
      var s = Math.max(W / SRC.w, H / SRC.h);
      var ox = (W - SRC.w * s) * px;
      var oy = (H - SRC.h * s) * py;
      var origX = px * W, origY = py * H;
      var vx = ox + SRC.cx * s, vy = oy + SRC.cy * s;
      var cx = origX + (vx - origX) * k;
      var cy = origY + (vy - origY) * k;
      var r = SRC.r * s * k;
      if (!isWide) {
        // her full silhouette fills nearly the whole mobile frame — a true-scale
        // ring would collide with the header/footer text, so settle it into the
        // clear band between them instead of matching her exact proportions.
        var topSafe = 218, bottomSafe = H - 150;
        r = Math.min(r, W * 0.72, (bottomSafe - topSafe) / 2);
        cy = Math.max(topSafe + r, Math.min(cy, bottomSafe - r));
      }
      ring.style.width = ring.style.height = (2 * r) + 'px';
      ring.style.left = (cx - r) + 'px';
      ring.style.top = (cy - r) + 'px';
      ring.classList.add('ready');
    }

    layout();
    window.addEventListener('resize', layout);
    wide.addEventListener('change', layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  })();
</script>
