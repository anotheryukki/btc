<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>$BTC — Big Titty Cult</title>
<meta name="description" content="$BTC. Enter of your own free will.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#050302;
    --bone:#ede4d6;
    --bone-60:rgba(237,228,214,0.6);
    --bone-40:rgba(237,228,214,0.4);
    --crimson:#c8283a;
    --gold:rgba(187,148,80,0.85);
    --gold-30:rgba(187,148,80,0.3);
    --gold-20:rgba(187,148,80,0.2);
    --frame-y:clamp(14px,2.6vh,26px);
    --frame-x:clamp(16px,3.2vw,34px);
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    overscroll-behavior:none;
  }

  body{
    font-family:'JetBrains Mono',monospace;
    color:var(--bone);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .font-black{
    font-family:'Pirata One',serif;
  }

  .stage{
    position:relative;
    height:100dvh;
    width:100vw;
    overflow:hidden;
  }

  .video-bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 58%;
    z-index:0;
  }

  @media (min-width:640px){
    .video-bg{
      object-position:92% 22%;
      transform:scale(1.28);
      transform-origin:92% 22%;
    }
  }

  .scrim{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(to bottom,
        rgba(4,2,2,0.72) 0%,
        rgba(4,2,2,0.2) 14%,
        rgba(4,2,2,0.0) 26%,
        rgba(4,2,2,0.0) 62%,
        rgba(4,2,2,0.45) 82%,
        rgba(4,2,2,0.9) 100%),
      radial-gradient(ellipse 80% 70% at 45% 45%,
        rgba(0,0,0,0) 42%,
        rgba(4,2,2,0.6) 100%);
  }

  .grade{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(ellipse 90% 80% at 50% 40%, rgba(120,18,30,0.1), rgba(18,4,6,0.32) 100%);
    mix-blend-mode:multiply;
  }

  .grain{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.04;
    mix-blend-mode:overlay;
  }

  /* the page frame — turns empty margins into a designed manuscript border */
  .frame{
    position:fixed;
    inset:var(--frame-y) var(--frame-x);
    border:1px solid var(--gold-30);
    z-index:6;
    pointer-events:none;
  }
  .stud{
    position:fixed;
    width:6px;
    height:6px;
    background:var(--gold);
    z-index:7;
    pointer-events:none;
  }
  .stud-tl{ top:var(--frame-y); left:var(--frame-x); transform:translate(-50%,-50%) rotate(45deg); }
  .stud-tr{ top:var(--frame-y); right:var(--frame-x); transform:translate(50%,-50%) rotate(45deg); }
  .stud-bl{ bottom:var(--frame-y); left:var(--frame-x); transform:translate(-50%,50%) rotate(45deg); }
  .stud-br{ bottom:var(--frame-y); right:var(--frame-x); transform:translate(50%,50%) rotate(45deg); }

  .rule-vert{
    position:fixed;
    top:calc(var(--frame-y) + clamp(56px,9.6vh,92px));
    bottom:calc(var(--frame-y) + clamp(56px,9.6vh,92px));
    left:44%;
    width:1px;
    background:linear-gradient(to bottom, transparent, var(--gold-20) 18%, var(--gold-20) 82%, transparent);
    z-index:4;
    pointer-events:none;
  }

  .content{
    position:relative;
    z-index:5;
    height:100%;
    width:100%;
  }

  .mono-label{
    font-size:11px;
    font-weight:500;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--bone-60);
    text-shadow:0 1px 2px rgba(0,0,0,0.7);
  }
  .mono-label .mark{
    color:var(--crimson);
    margin-right:0.5em;
  }

  .chrome{
    position:absolute;
    left:calc(var(--frame-x) + clamp(8px,1.8vw,22px));
    right:calc(var(--frame-x) + clamp(8px,1.8vw,22px));
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }
  .chrome-top{
    top:var(--frame-y);
    padding-bottom:clamp(14px,2.4vh,22px);
    border-bottom:1px solid var(--gold-20);
  }
  .chrome-bottom{
    bottom:var(--frame-y);
    align-items:flex-end;
    padding-top:clamp(14px,2.4vh,22px);
    border-top:1px solid var(--gold-20);
  }

  .x-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--bone);
    text-decoration:none;
    padding:6px 2px;
    transition:transform 320ms cubic-bezier(0.22,1,0.36,1), opacity 320ms ease;
  }
  .x-link .arrow{
    display:inline-block;
    transition:transform 320ms cubic-bezier(0.22,1,0.36,1);
  }
  .x-link:hover{opacity:1; transform:translateY(-1px);}
  .x-link:hover .arrow{transform:translate(2px,-2px);}
  .x-link:active{transform:translateY(0) scale(0.98);}
  .x-link:focus-visible{outline:2px solid var(--crimson); outline-offset:4px;}

  .hero{
    position:absolute;
    right:clamp(14px,2.2vw,32px);
    top:50%;
    transform:translateY(-52%);
    text-align:right;
    max-width:60vw;
  }

  .wordmark{
    position:relative;
    font-size:min(41vh, 29vw);
    line-height:0.84;
    letter-spacing:-0.005em;
    color:var(--bone);
    text-shadow:0 2px 6px rgba(0,0,0,0.65), 0 24px 70px rgba(0,0,0,0.65);
    margin:0;
  }
  .wordmark::before{
    content:"";
    position:absolute;
    right:-8%;
    top:50%;
    width:78%;
    height:78%;
    transform:translateY(-50%);
    background:radial-gradient(closest-side, rgba(200,40,58,0.22), rgba(200,40,58,0) 72%);
    z-index:-1;
    pointer-events:none;
  }
  .wordmark .sym{
    color:var(--crimson);
  }

  .tagline{
    margin-top:clamp(14px,2.4vh,24px);
    font-size:clamp(15px,1.5vw,19px);
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--bone-60);
    text-shadow:0 1px 2px rgba(0,0,0,0.7);
  }

  .ca{
    display:inline-flex;
    flex-direction:column;
    align-items:flex-end;
    gap:7px;
    flex-shrink:0;
  }
  .ca-value{
    font-size:clamp(16px,2.2vh,21px);
    font-weight:600;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--bone);
    text-shadow:0 1px 2px rgba(0,0,0,0.7);
    line-height:1;
  }
  .ca-value .cursor{
    display:inline-block;
    width:0.5em;
    height:1em;
    vertical-align:-0.1em;
    margin-left:0.18em;
    background:var(--crimson);
    animation:blink 1.1s steps(1) infinite;
  }
  .ca-line{
    width:120px;
    height:1px;
    background:linear-gradient(to left, var(--bone-40), transparent);
  }

  @keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:0;}
  }

  .foot{
    max-width:36ch;
    text-align:left;
    font-size:10px;
    line-height:1.7;
    letter-spacing:0.02em;
    color:var(--bone-40);
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
  }

  .reveal{
    opacity:0;
    animation:reveal 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes reveal{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .hero.reveal{
    animation-name:reveal-hero;
  }
  @keyframes reveal-hero{
    from{opacity:0; transform:translateY(calc(-52% + 14px));}
    to{opacity:1; transform:translateY(-52%);}
  }

  @media (max-width:639px){
    .rule-vert{display:none;}
    .hero{
      right:auto;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      text-align:center;
      max-width:92vw;
      width:max-content;
    }
    .hero.reveal{animation-name:reveal-hero-m;}
    @keyframes reveal-hero-m{
      from{opacity:0; transform:translate(-50%,calc(-50% + 12px));}
      to{opacity:1; transform:translate(-50%,-50%);}
    }
    .wordmark{font-size:min(13vh, 26vw);}
    .tagline{margin-top:10px; font-size:11px;}
    .chrome-bottom{
      flex-direction:column-reverse;
      align-items:center;
      gap:16px;
      text-align:center;
    }
    .chrome-bottom .foot{text-align:center; max-width:88vw;}
    .chrome-bottom .ca{align-items:center;}
    .ca-line{background:linear-gradient(to right, transparent, var(--bone-40), transparent);}
  }

  @media (max-height:560px){
    .tagline{display:none;}
  }

  @media (prefers-reduced-motion: reduce){
    .ca-value .cursor{animation:none;}
    .reveal,.hero.reveal{animation:none; opacity:1;}
    .x-link,.x-link .arrow{transition:none;}
  }
</style>
</head>
<body>

<div class="stage">

  <video class="video-bg" id="bg" autoplay muted loop playsinline preload="auto">
    <source src="hf_20260921_123023_0ad7c320-db24-43bf-a219-9e8766a4043e.mp4" type="video/mp4">

  </div>
</div>

</body>
