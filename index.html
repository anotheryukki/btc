<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#050302;
    --crimson:#7a1220;
    --crimson-bright:#d8384a;
    --bone:#f1e7d9;
    --ash:#b8ac9e;
    --gold:#bb9450;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    overscroll-behavior:none;
  }

  body{
    font-family:'Manrope',sans-serif;
    color:var(--bone);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .font-serif{
    font-family:'Cinzel',serif;
  }

  .font-mono{
    font-family:'JetBrains Mono',monospace;
  }

  .stage{
    position:relative;
    height:100dvh;
    width:100vw;
    overflow:hidden;
  }

  .video-bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 58%;
    z-index:0;
  }

  @media (min-width:640px){
    .video-bg{
      object-position:92% 22%;
      transform:scale(1.28);
      transform-origin:92% 22%;
    }
  }

  /* layered scrim: top + bottom read-bands, side vignette, cult color grade */
  .scrim{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(to bottom,
        rgba(4,2,2,0.82) 0%,
        rgba(4,2,2,0.42) 12%,
        rgba(4,2,2,0.0) 26%,
        rgba(4,2,2,0.0) 66%,
        rgba(4,2,2,0.38) 84%,
        rgba(4,2,2,0.84) 100%),
      radial-gradient(ellipse 85% 70% at 50% 48%,
        rgba(0,0,0,0) 40%,
        rgba(4,2,2,0.5) 100%);
  }

  .grade{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(ellipse 90% 80% at 50% 40%, rgba(125,15,28,0.12), rgba(20,4,6,0.3) 100%);
    mix-blend-mode:multiply;
  }

  .grain{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.045;
    mix-blend-mode:overlay;
  }

  /* quatrefoil tracery — the sealed-page corners */
  .corner{
    position:fixed;
    z-index:6;
    width:clamp(20px,3.2vw,30px);
    height:clamp(20px,3.2vw,30px);
    pointer-events:none;
    opacity:0.6;
  }
  .corner-tl{ top:clamp(12px,2.4vh,20px); left:clamp(12px,2.4vw,20px); }
  .corner-tr{ top:clamp(12px,2.4vh,20px); right:clamp(12px,2.4vw,20px); transform:scaleX(-1); }
  .corner-bl{ bottom:clamp(12px,2.4vh,20px); left:clamp(12px,2.4vw,20px); transform:scaleY(-1); }
  .corner-br{ bottom:clamp(12px,2.4vh,20px); right:clamp(12px,2.4vw,20px); transform:scale(-1,-1); }

  .content{
    position:relative;
    z-index:4;
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding:clamp(28px,5.5vh,52px) clamp(20px,4.5vw,52px);
  }

  .tracked{
    letter-spacing:0.3em;
  }

  .hairline{
    display:inline-block;
    width:26px;
    height:1px;
    background:linear-gradient(to right, transparent, rgba(187,148,80,0.7));
    vertical-align:middle;
  }
  .hairline.flip{
    background:linear-gradient(to left, transparent, rgba(187,148,80,0.7));
  }

  .rule{
    display:block;
    height:1px;
    width:34px;
    margin:12px auto 0;
    background:linear-gradient(to right, transparent, rgba(187,148,80,0.55), transparent);
  }

  /* gothic arch frame around the hero mark */
  .arch-wrap{
    position:relative;
    width:clamp(240px,58vw,400px);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(20px,4vh,32px) clamp(18px,3vw,28px) clamp(14px,2.5vh,20px);
    background:radial-gradient(ellipse 70% 62% at 50% 42%, rgba(5,3,2,0.4), rgba(5,3,2,0) 100%);
  }
  .arch-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  /* carved plate — CA pill, sharp chamfered corners instead of a soft glass pill */
  .plate{
    background:rgba(6,4,3,0.6);
    clip-path:polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
    border:1px solid rgba(187,148,80,0.32);
    box-shadow:inset 0 0 0 1px rgba(187,148,80,0.12), 0 16px 40px -16px rgba(0,0,0,0.7);
  }

  .plate-pill{
    padding:clamp(11px,1.7vh,14px) clamp(22px,3.4vw,32px);
  }

  .sigil-wrap{
    filter:drop-shadow(0 0 14px rgba(216,56,74,0.28));
  }
  .sigil-spin{
    animation:spin 170s linear infinite;
    transform-origin:50% 50%;
  }
  .sigil-breathe{
    animation:breathe 5s cubic-bezier(0.45,0,0.55,1) infinite;
    transform-origin:50% 50%;
  }

  @keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  @keyframes breathe{
    0%,100%{opacity:0.75; transform:scale(1);}
    50%{opacity:1; transform:scale(1.04);}
  }

  .pulse-dot{
    animation:pulse 2.6s cubic-bezier(0.45,0,0.55,1) infinite;
  }

  @keyframes pulse{
    0%,100%{opacity:0.5; transform:scale(0.85);}
    50%{opacity:1; transform:scale(1.15);}
  }

  .reveal{
    opacity:0;
    animation:reveal 1s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  @keyframes reveal{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  .x-btn{
    transition:transform 320ms cubic-bezier(0.22,1,0.36,1), border-color 320ms ease, box-shadow 320ms ease, background-color 320ms ease;
  }
  .x-btn:hover{
    transform:translateY(-2px) scale(1.05);
    border-color:rgba(216,56,74,0.55);
    box-shadow:0 0 24px rgba(216,56,74,0.22);
  }
  .x-btn:active{
    transform:translateY(0) scale(0.96);
    transition-duration:120ms;
  }
  .x-btn:focus-visible{
    outline:2px solid var(--crimson-bright);
    outline-offset:3px;
  }

  .ca-pill{
    transition:border-color 320ms ease, box-shadow 320ms ease;
  }
  .ca-pill:hover{
    border-color:rgba(187,148,80,0.55);
    box-shadow:inset 0 0 0 1px rgba(187,148,80,0.18), 0 0 34px rgba(216,56,74,0.18);
  }

  @media (prefers-reduced-motion: reduce){
    .sigil-spin,.sigil-breathe,.pulse-dot{animation:none;}
    .reveal{animation:none; opacity:1;}
    .x-btn,.ca-pill{transition:none;}
  }

  @media (max-height: 760px){
    .hero-tagline{display:none;}
  }

  @media (max-height: 620px){
    .sigil-wrap{display:none;}
  }

  @media (max-height: 480px){
    .eyebrow-row{display:none;}
  }
</style>
