<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>$BTC — Big Titty Cult</title>
<meta name="description" content="$BTC. Enter of your own free will.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#050302;
    --crimson:#7d0f1c;
    --crimson-bright:#e02c3c;
    --bone:#ece3d6;
    --ash:#8a8078;
    --gold:#a9822f;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    overscroll-behavior:none;
  }

  body{
    font-family:'Manrope',sans-serif;
    color:var(--bone);
    -webkit-font-smoothing:antialiased;
  }

  .font-display{
    font-family:'Cinzel',serif;
  }

  .font-mono{
    font-family:'JetBrains Mono',monospace;
  }

  .stage{
    position:relative;
    height:100dvh;
    width:100vw;
    overflow:hidden;
  }

  .video-bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 58%;
    z-index:0;
  }

  @media (min-width:640px){
    .video-bg{
      object-position:72% 58%;
      transform:scale(1.28);
      transform-origin:72% 50%;
    }
  }

  /* layered scrim: top + bottom read-bands, side vignette, cult color grade */
  .scrim{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(to bottom,
        rgba(4,2,2,0.96) 0%,
        rgba(4,2,2,0.8) 10%,
        rgba(4,2,2,0.32) 21%,
        rgba(4,2,2,0.0) 30%,
        rgba(4,2,2,0.0) 64%,
        rgba(4,2,2,0.55) 82%,
        rgba(4,2,2,0.95) 100%),
      radial-gradient(ellipse 85% 70% at 50% 48%,
        rgba(0,0,0,0) 40%,
        rgba(4,2,2,0.55) 100%);
  }

  .grade{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(ellipse 90% 80% at 50% 40%, rgba(125,15,28,0.14), rgba(20,4,6,0.34) 100%);
    mix-blend-mode:multiply;
  }

  .grain{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:overlay;
  }

  .content{
    position:relative;
    z-index:4;
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:clamp(16px,3.5vh,32px) clamp(16px,4vw,48px);
  }

  .tracked{
    letter-spacing:0.32em;
  }

  .sigil{
    filter:drop-shadow(0 0 14px rgba(224,44,60,0.35));
    animation:spin 140s linear infinite;
    transform-origin:50% 50%;
  }

  @keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  .pulse-dot{
    animation:pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(224,44,60,0.55);}
    50%{opacity:0.55; box-shadow:0 0 0 6px rgba(224,44,60,0);}
  }

  .x-btn{
    transition:transform 220ms cubic-bezier(0.16,1,0.3,1), border-color 220ms ease, box-shadow 220ms ease;
  }
  .x-btn:hover{
    transform:translateY(-2px) scale(1.04);
    border-color:rgba(224,44,60,0.6);
    box-shadow:0 0 22px rgba(224,44,60,0.25);
  }
  .x-btn:active{
    transform:translateY(0) scale(0.97);
  }
  .x-btn:focus-visible{
    outline:2px solid var(--crimson-bright);
    outline-offset:3px;
  }

  .ca-pill{
    transition:border-color 220ms ease, box-shadow 220ms ease;
  }
  .ca-pill:hover{
    border-color:rgba(224,44,60,0.55);
    box-shadow:0 0 30px rgba(224,44,60,0.16);
  }

  @media (prefers-reduced-motion: reduce){
    .sigil{animation:none;}
    .pulse-dot{animation:none;}
    .x-btn,.ca-pill{transition:none;}
  }

  @media (max-height: 760px){
    .hero-tagline{display:none;}
  }

  @media (max-height: 620px){
    header .sigil{display:none;}
  }

  @media (max-height: 500px){
    header p.uppercase.font-display{display:none;}
  }
</style>
</head>
<body>

<div class="stage">

  <video class="video-bg" autoplay muted loop playsinline preload="auto">
    <source src="hf_20260921_123023_0ad7c320-db24-43bf-a219-9e8766a4043e.mp4" type="video/mp4">
  </video>
  <div class="scrim"></div>
  <div class="grade"></div>

  <svg class="grain" width="100%" height="100%">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <rect width="100%" height="100%" filter="url(#noise)"></rect>
  </svg>

  <div class="content">

    <!-- top: sigil + wordmark, X link -->
    <header class="relative flex flex-col items-center pt-1 sm:pt-2">
      <a
        href="#"

        class="x-btn absolute right-0 top-0 flex h-9 w-9 sm:h-10 sm:w-10 items-center justify-center rounded-full border border-[rgba(236,227,214,0.18)] bg-[rgba(5,3,2,0.35)] backdrop-blur-sm"
      >
        <span class="font-display text-[15px] sm:text-base leading-none text-[var(--bone)]">X</span>
      </a>

      <svg class="sigil mb-1.5 sm:mb-2" style="width:max(28px, min(7vw, 6vh, 46px)); height:max(28px, min(7vw, 6vh, 46px));" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(169,130,47,0.55)" stroke-width="0.6"/>
        <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(224,44,60,0.45)" stroke-width="0.6"/>
        <g stroke="rgba(169,130,47,0.4)" stroke-width="0.6">
          <line x1="50" y1="4" x2="50" y2="16"/>
          <line x1="50" y1="84" x2="50" y2="96"/>
          <line x1="4" y1="50" x2="16" y2="50"/>
          <line x1="84" y1="50" x2="96" y2="50"/>
          <line x1="17.5" y1="17.5" x2="25.5" y2="25.5"/>
          <line x1="74.5" y1="74.5" x2="82.5" y2="82.5"/>
          <line x1="82.5" y1="17.5" x2="74.5" y2="25.5"/>
          <line x1="25.5" y1="74.5" x2="17.5" y2="82.5"/>
        </g>
        <path d="M27 50 C 37 34, 63 34, 73 50 C 63 66, 37 66, 27 50 Z" fill="none" stroke="rgba(236,227,214,0.75)" stroke-width="0.9"/>
        <circle cx="50" cy="50" r="7.5" fill="none" stroke="rgba(236,227,214,0.85)" stroke-width="0.9"/>
        <circle cx="50" cy="50" r="2.6" fill="rgba(224,44,60,0.85)"/>
      </svg>

      <h1 class="font-display tracked leading-none text-[var(--bone)]" style="font-size:max(24px, min(9vw, 6.5vh, 46px)); text-shadow:0 2px 20px rgba(0,0,0,0.9), 0 0 28px rgba(224,44,60,0.28);">
        $BTC
      </h1>
      <p class="tracked font-display mt-2 text-[var(--crimson-bright)] uppercase" style="font-size:max(9px, min(2.4vw, 1.7vh, 12px)); letter-spacing:0.5em; text-shadow:0 2px 10px rgba(0,0,0,0.9);">
        Big Titty Cult
      </p>
      <p class="hero-tagline tracked mt-1.5 sm:mt-2 text-[var(--ash)] uppercase" style="font-size:max(9px, min(2.1vw, 1.5vh, 10px)); text-shadow:0 2px 8px rgba(0,0,0,0.95);">
        Enter of your own free will
      </p>
    </header>

    <!-- bottom: CA + disclaimer -->
    <footer class="flex flex-col items-center gap-3 sm:gap-4 pb-1">
      <div class="ca-pill flex items-center gap-2.5 sm:gap-3 rounded-full border border-[rgba(236,227,214,0.16)] bg-[rgba(5,3,2,0.4)] backdrop-blur-sm px-4 sm:px-6 py-2 sm:py-2.5">
        <span class="pulse-dot h-1.5 w-1.5 rounded-full bg-[var(--crimson-bright)]"></span>
        <span class="tracked text-[9px] sm:text-[10px] uppercase text-[var(--ash)]">Contract Address</span>
        <span class="h-3 w-px bg-[rgba(236,227,214,0.18)]"></span>
        <span class="font-mono text-[11px] sm:text-xs tracking-[0.15em] uppercase text-[var(--bone)]">Soon</span>
      </div>

      <p class="max-w-[300px] sm:max-w-md text-center text-[9px] sm:text-[10px] leading-relaxed text-[rgba(138,128,120,0.85)]">
        $BTC is a memecoin made for entertainment only — no intrinsic value, no utility, no promises. Not financial advice. Enter the cult at your own risk.
      </p>
    </footer>

  </div>
</div>

</body>
</html>
